[workspace]
resolver = "2"
members = ["crates/mcp-tunnel", "crates/mcp-tunnel-client"]
exclude = ["examples/basic"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/pragmalabs-tech/mcp-tunnel"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
colored = "3"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
